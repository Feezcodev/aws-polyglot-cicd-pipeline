version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.x
      nodejs: 18
      python: 3.x
  build:
    commands:
      - echo "Starting build process..."
      - go version
      - node --version
      - python3 --version
      - go build -o app main.go
      - ./app

artifacts:
  files:
    - app