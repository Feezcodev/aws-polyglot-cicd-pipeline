version: 0.2

phases:
  install:
    runtime-versions:
      golang: 1.22
    commands:
      - echo Installing dependencies...
      - go mod download
  build:
    commands:
      - echo Building Go application...
      - go build -o main main.go
  post_build:
    commands:
      - echo Build phase completed successfully on $(date)
      - echo Packaging artifacts for deployment...

artifacts:
  files:
    - main
    - '**/*'